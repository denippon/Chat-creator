<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comic Chat — Twitch overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: Verdana, Geneva, sans-serif;
  }
  #stage {
    position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 90px, #000 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 90px, #000 100%);
  }
  #strip {
    position: absolute; left: 0; bottom: 0;
    display: flex; align-items: flex-end;
    transition: transform .5s cubic-bezier(.18,.86,.24,1);
    will-change: transform;
  }
  .panel {
    flex: 0 0 auto;
    background: #fffdf3;
    box-shadow: 4px 5px 0 rgba(0,0,0,.28);
    animation: pop .28s cubic-bezier(.2,1.5,.4,1) both;
  }
  .panel svg { display: block; }
  @keyframes pop { from { transform: scale(.88) translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }

  #hud {
    position: absolute; left: 10px; top: 8px;
    font: 11px/1.5 Verdana, sans-serif; color: #fff;
    background: rgba(0,0,0,.62); padding: 5px 9px; border-radius: 3px;
    white-space: pre; pointer-events: none;
  }
  #hud.hide { display: none }

  @media (prefers-reduced-motion: reduce) {
    #strip { transition: none }
    .panel { animation: none }
  }
</style>
</head>
<body>
<div id="stage"><div id="strip"></div></div>
<div id="hud" class="hide"></div>

<script src="js/comic-avatar.js"></script>
<script src="js/comic-engine.js"></script>
<script src="js/comic-twitch.js"></script>
<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var CFG = {
    channel:  Q.get('channel') || '',
    panels:   Math.max(1, +Q.get('panels') || 3),
    gap:      +Q.get('gap') || 14,
    roster:   Q.get('roster') || 'avatars/roster.json',
    poll:     Math.max(0, (+Q.get('poll') || 30)) * 1000,
    sbws:     Q.get('sbws') || '',
    idle:     (+Q.get('idle') || 25) * 1000,
    life:     (+Q.get('life') || 0) * 1000,     // 0 = panels stay until pushed off
    cmds:     Q.get('cmds') === '1',
    ignore:   (Q.get('ignore') || 'nightbot,streamelements,streamlabs,moobot,fossabot,soundalerts')
                .toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean),
    demo:     Q.get('demo') === '1',
    debug:    Q.get('debug') === '1'
  };
  ComicEngine.CFG.IDLE = CFG.idle;

  var strip = document.getElementById('strip');
  var hud = document.getElementById('hud');
  var panels = [];            // [{model, el}]
  var roster = {};            // login -> spec
  var pw = 400, ph = 320;
  var status = 'idle';

  /* ------------------------------------------------------------ sizing */
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    pw = (vw - CFG.gap * (CFG.panels - 1)) / CFG.panels;
    ph = pw * (ComicEngine.CFG.PH / ComicEngine.CFG.PW);
    if (ph > vh) { ph = vh; pw = ph * (ComicEngine.CFG.PW / ComicEngine.CFG.PH); }
    strip.style.gap = CFG.gap + 'px';
    panels.forEach(function (p) { p.el.style.width = pw + 'px'; p.el.style.height = ph + 'px'; });
    slide(true);
  }
  window.addEventListener('resize', resize);

  function slide(instant) {
    var total = panels.length * (pw + CFG.gap) - CFG.gap;
    var off = Math.max(0, total - window.innerWidth);
    if (instant) strip.style.transition = 'none';
    strip.style.transform = 'translateX(' + (-off) + 'px)';
    if (instant) { void strip.offsetWidth; strip.style.transition = ''; }
  }

  /* ------------------------------------------------------------ avatars */
  function specFor(msg) {
    var custom = roster[msg.login];
    if (custom) { custom.name = custom.name || msg.user; return custom; }
    return ComicAvatar.fromSeed(msg.login || msg.user, msg.color);
  }

  function ingestRoster(obj) {
    var src = obj && obj.avatars ? obj.avatars : obj;
    if (!src || typeof src !== 'object') return 0;
    var n = 0;
    Object.keys(src).forEach(function (k) {
      var v = src[k];
      var spec = typeof v === 'string' ? ComicAvatar.decode(v) : ComicAvatar.normalize(v);
      if (spec) { roster[k.toLowerCase().replace(/^@/, '')] = spec; n++; }
    });
    return n;
  }

  function loadRoster() {
    if (!CFG.roster) return;
    fetch(CFG.roster + (CFG.roster.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) { ingestRoster(j); paintHud(); } })
      .catch(function () { /* file missing is fine — everyone gets an auto avatar */ });
  }

  /* --------------------------------------------- Streamer.bot (optional) */
  function connectSB() {
    if (!CFG.sbws) return;
    var ws;
    try { ws = new WebSocket(CFG.sbws); } catch (e) { return; }
    ws.onopen = function () {
      ws.send(JSON.stringify({ request: 'Subscribe', id: 'comicchat', events: { General: ['Custom'] } }));
    };
    ws.onmessage = function (ev) {
      var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      var p = (d && d.data) || {};
      // Broadcast {"comicAvatar":{"user":"name","code":"CC1-..."}} from a C# action
      var a = p.comicAvatar || p.ComicAvatar;
      if (a && a.user && a.code) {
        var spec = ComicAvatar.decode(a.code);
        if (spec) { roster[String(a.user).toLowerCase()] = spec; paintHud(); }
      }
      if (p.comicRosterReload) loadRoster();
    };
    ws.onclose = function () { setTimeout(connectSB, 5000); };
  }

  /* ------------------------------------------------------------- panels */
  function pushPanel() {
    var m = ComicEngine.newPanel();
    var el = document.createElement('div');
    el.className = 'panel';
    el.style.width = pw + 'px'; el.style.height = ph + 'px';
    strip.appendChild(el);
    var p = { model: m, el: el };
    panels.push(p);
    trim();
    slide(false);
    return p;
  }

  function trim() {
    while (panels.length > CFG.panels + 3) {
      var old = panels.shift();
      old.el.remove();
      slide(true);
    }
  }

  function paint(p) { p.el.innerHTML = ComicEngine.render(p.model); }

  function current() {
    return panels.length ? panels[panels.length - 1] : null;
  }

  function addMessage(msg) {
    msg.spec = specFor(msg);
    var p = current();
    if (!p || !ComicEngine.tryAdd(p.model, msg)) {
      if (p) p.model.closed = true;
      p = pushPanel();
      if (!ComicEngine.tryAdd(p.model, msg)) {   // single message too tall: hard-trim it
        msg.tokens = msg.tokens.slice(0, 26);
        msg.metrics = null;
        if (!ComicEngine.tryAdd(p.model, msg)) return;
      }
    }
    paint(p);
  }

  function dropUser(login) {
    for (var i = panels.length - 1; i >= 0; i--) {
      var m = panels[i].model;
      if (m.balloons.some(function (b) { return b.login === login; })) {
        m.balloons = m.balloons.filter(function (b) { return b.login !== login; });
        m.cast = m.cast.filter(function (c) { return c.login !== login; });
        if (!m.balloons.length) { panels[i].el.remove(); panels.splice(i, 1); slide(true); continue; }
        m.laid = ComicEngine.layout(m.cast, m.balloons);
        paint(panels[i]);
      }
    }
  }

  setInterval(function () {
    var p = current();
    if (p && p.model.balloons.length && Date.now() - p.model.last > CFG.idle) p.model.closed = true;
    if (CFG.life) {
      var cut = Date.now() - CFG.life;
      while (panels.length > 1 && panels[0].model.last < cut) {
        panels.shift().el.remove(); slide(true);
      }
    }
  }, 2000);

  /* ---------------------------------------------------------------- HUD */
  function paintHud() {
    if (!CFG.debug) return;
    hud.classList.remove('hide');
    hud.textContent = '#' + (CFG.channel || '(none)') + '  ' + status +
      '\npanels ' + panels.length + '  custom avatars ' + Object.keys(roster).length;
  }

  /* --------------------------------------------------------------- boot */
  resize();
  loadRoster();
  if (CFG.poll) setInterval(loadRoster, CFG.poll);
  connectSB();

  function accept(msg) {
    var login = (msg.login || '').toLowerCase();
    if (CFG.ignore.indexOf(login) >= 0) return false;
    if (!CFG.cmds && /^!/.test(msg.text.trim())) return false;
    return true;
  }

  if (CFG.channel) {
    var chat = new ComicTwitch.Chat({
      channel: CFG.channel,
      onMessage: function (m) { if (accept(m)) addMessage(m); },
      onClear: function (login) { dropUser(login); },
      onStatus: function (s) { status = s; paintHud(); }
    });
    chat.connect();
  } else if (!CFG.demo) {
    status = 'no ?channel= given';
    CFG.debug = true; paintHud();
  }

  /* ------------------------------------------------------------ demo mode */
  if (CFG.demo) {
    var cast = ['Dennis', 'RetroKlaus', 'Miyuki', 'pixel_gremlin', 'HanselBot'];
    var script = [
      'hey chat! back with the comic overlay',
      'LUL this is amazing',
      'wait what is that made of',
      'IT IS ALL SVG???',
      'hmm I wonder if it scales',
      'GG <3',
      'kann ich mir auch einen avatar bauen?',
      'yes — redeem the channel point and paste your code',
      ':D',
      'ResidentSleeper',
      'omg pog',
      'do the thing with the balloons again'
    ];
    var i = 0;
    setInterval(function () {
      var text = script[i % script.length];
      var user = cast[Math.floor(Math.random() * cast.length)];
      var tk = ComicTwitch.tokenize(text, '');
      var cls = ComicTwitch.classify(text, tk.emoteNames);
      addMessage({
        user: user, login: user.toLowerCase(), color: '',
        text: text, tokens: tk.tokens, emotion: cls.emotion, kind: cls.kind, ts: Date.now()
      });
      i++;
    }, 1800);
  }
})();
</script>
</body>
</html>
